[workspace]
resolver = "3"
members = ["crates/vanta-core", "crates/vanta-modrinth", "crates/vanta-app"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Inpriv/vanta"
homepage = "https://getvanta.xyz"
authors = ["Inpriv"]
rust-version = "1.92"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# UI, font, SVG and D-Bus code is not on any hot path (rendering runs on the
# GPU, the launcher's work is I/O-bound), so dependencies are optimised for
# size. Everything Vanta itself runs hot stays at opt-level 3.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.vanta-core]
opt-level = 3
[profile.release.package.vanta-modrinth]
opt-level = 3
[profile.release.package.tokio]
opt-level = 3
[profile.release.package.rustls]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.zip]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.h2]
opt-level = 3
[profile.release.package.hyper]
opt-level = 3

# Release build with symbols kept, for size analysis (`cargo bloat --profile bloat`).
[profile.bloat]
inherits = "release"
strip = false
