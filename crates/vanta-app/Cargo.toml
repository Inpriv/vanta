[package]
name = "vanta-app"
description = "Vanta, a fast and minimal Minecraft: Java Edition launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "vanta"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
minisign-verify = "0.3.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
slint = { version = "1.13.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
vanta-core = { version = "0.1.0", path = "../vanta-core" }
vanta-modrinth = { version = "0.1.0", path = "../vanta-modrinth" }

[build-dependencies]
slint-build = "1.13.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_Foundation"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
