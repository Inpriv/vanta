[package]
name = "vanta-app"
description = "Vanta, a fast and minimal Minecraft: Java Edition launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "vanta"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
keyring = "3.6.3"
slint = "1.13.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
vanta-core = { version = "0.1.0", path = "../vanta-core" }
vanta-modrinth = { version = "0.1.0", path = "../vanta-modrinth" }

[build-dependencies]
slint-build = "1.13.1"
