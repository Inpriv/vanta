[package]
name = "vanta-app"
description = "Vanta, a fast and minimal Minecraft: Java Edition launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "vanta"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
minisign-verify = "0.3.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
slint = { version = "1.13.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
vanta-core = { version = "0.1.0", path = "../vanta-core" }
vanta-modrinth = { version = "0.1.0", path = "../vanta-modrinth" }

[build-dependencies]
slint-build = "1.13.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_Foundation"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[package.metadata.deb]
name = "vanta"
maintainer = "Inpriv <323694632+Inpriv@users.noreply.github.com>"
copyright = "Inpriv"
license-file = ["../../LICENSE", "0"]
extended-description = "Vanta is an open-source launcher for Minecraft: Java Edition with Microsoft sign-in, isolated instances, Fabric/Quilt/Forge/NeoForge support and a Modrinth browser. No telemetry. Not an official Minecraft product."
section = "games"
priority = "optional"
depends = "$auto, libfontconfig1, libxkbcommon0, libdbus-1-3"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/vanta", "usr/bin/vanta", "755"],
    ["../../packaging/linux/xyz.getvanta.Vanta.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/xyz.getvanta.Vanta.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/icons/vanta.svg", "usr/share/icons/hicolor/scalable/apps/xyz.getvanta.Vanta.svg", "644"],
    ["../../packaging/icons/vanta-16.png", "usr/share/icons/hicolor/16x16/apps/xyz.getvanta.Vanta.png", "644"],
    ["../../packaging/icons/vanta-32.png", "usr/share/icons/hicolor/32x32/apps/xyz.getvanta.Vanta.png", "644"],
    ["../../packaging/icons/vanta-48.png", "usr/share/icons/hicolor/48x48/apps/xyz.getvanta.Vanta.png", "644"],
    ["../../packaging/icons/vanta-64.png", "usr/share/icons/hicolor/64x64/apps/xyz.getvanta.Vanta.png", "644"],
    ["../../packaging/icons/vanta-128.png", "usr/share/icons/hicolor/128x128/apps/xyz.getvanta.Vanta.png", "644"],
    ["../../packaging/icons/vanta-256.png", "usr/share/icons/hicolor/256x256/apps/xyz.getvanta.Vanta.png", "644"],
    ["../../packaging/icons/vanta-512.png", "usr/share/icons/hicolor/512x512/apps/xyz.getvanta.Vanta.png", "644"],
]
