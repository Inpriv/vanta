[package]
name = "vanta-core"
description = "Core library of the Vanta Minecraft launcher: auth, versions, downloads, Java, instances and launching."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "form", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
